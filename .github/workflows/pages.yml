# 웹 버전(web/vectorman.html)을 GitHub Pages(vm.scubob.com)로 배포
# - main 에 web/ 이 바뀌면, 또는 'PC 엔진 빌드'(zip 업데이트)가 끝나면 자동 실행
#   (Actions 가 커밋한 변경은 push 트리거가 안 걸리므로 workflow_run 으로 받음)
name: 웹 배포 (Pages)

on:
  push:
    branches: [main]
    paths: ['web/**', 'CNAME', '.github/workflows/pages.yml']
  workflow_run:
    workflows: ['PC 엔진 빌드']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: 사이트 폴더 만들기
        run: |
          mkdir -p _site
          cp web/vectorman.html _site/index.html
          cp CNAME _site/CNAME
          cp assets/vm.ico _site/favicon.ico
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: dep
        uses: actions/deploy-pages@v4
