:root{--app:#232323;--panel:#262626;--deep:#1e1e1e;--line:#3a3a3a;--line2:#555;--ink:#e6e6e6;--sub:#9a9a9a;--dim:#6a6a6a;--blue:#2f4f78;--edge:#4a8fe0;--red:#c0392b;--key:#f2c94c;--desk:#d9d5cf;--dot:#c3beb6}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--app);color:var(--ink);font:13px/1.4 "Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic","맑은 고딕",system-ui,sans-serif;display:grid;grid-template-rows:52px minmax(0,1fr);overflow:hidden;user-select:none}
button{font:inherit;color:var(--ink);height:28px;padding:0 12px;cursor:pointer;border-radius:0}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--edge);outline-offset:1px}
select,input[type=text]{font:inherit;color:var(--ink);background:var(--deep);border:1px solid var(--line2);height:28px;padding:0 6px;border-radius:0;width:100%}
input[type=color]{width:100%;height:28px;padding:1px;background:var(--deep);border:1px solid var(--line2);border-radius:0;cursor:pointer}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--blue);margin:0}
/* 상단바 */
#top{display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--line);min-width:0}
#top .logo{display:flex;align-items:center;gap:9px;margin-right:6px;flex:none}
#top .logo svg{height:17px;width:auto;display:block}
#top .logo b{font:700 15px Heros,"Helvetica Neue",Arial,sans-serif;letter-spacing:.2px;white-space:nowrap}
#top button{height:34px;min-width:34px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
#top button svg{width:17px;height:17px}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px;flex:none}
.seg{display:flex;gap:0}.seg button{height:32px!important;font-size:12px}
.grow{flex:1}
#mstat{color:var(--sub);font-size:12px;display:flex;align-items:center;gap:8px;white-space:nowrap;min-width:0;flex:0 1 auto;overflow:hidden}#mtext{overflow:hidden;text-overflow:ellipsis}#bot>*:not(#mstat):not(.grow){flex:none}
#mbar{width:90px;height:5px;background:var(--deep);border:1px solid var(--line);display:none}
#mbar i{display:block;height:100%;width:0;background:var(--edge)}
.ver{font-size:11px;color:var(--sub);margin-right:4px;white-space:nowrap}
/* 본문 */
main{display:grid;grid-template-columns:64px 290px minmax(0,1fr) 290px;min-height:0}
#rail{border-right:1px solid var(--line);display:flex;flex-direction:column;padding:8px 6px;gap:4px}
#rail button{border:0;background:none;height:auto;padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--sub)}
#rail svg{width:22px;height:22px}
#rail button:hover{background:#2c2c2c;color:var(--ink)}
#rail button.on{background:var(--blue);color:#fff;box-shadow:inset 2px 0 0 var(--edge)}
.pan{background:var(--panel);display:flex;flex-direction:column;min-height:0}
#drawer{border-right:1px solid var(--line)}#side{border-left:1px solid var(--line)}
.ph{height:36px;flex:none;display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;font-weight:700;border-bottom:1px solid var(--line);background:#2a2a2a}
.ph .grow{flex:1}
#presetBtn{height:24px;font-size:11px;font-weight:400;padding:0 8px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb{flex:1;overflow:auto;padding:12px 10px}
.grp{display:none}.grp.show{display:block}
.grp h2{font-size:12px;color:var(--sub);font-weight:600;margin:4px 0 10px}
.grp+.grp.show h2{margin-top:16px}
#groups.one h2{display:none}
.r{display:grid;grid-template-columns:80px minmax(0,1fr) 50px;gap:8px;align-items:center;min-height:28px;margin-bottom:4px}
.r label{color:#cfcfcf;text-align:right;white-space:nowrap;font-size:12px}
.r .v{color:var(--sub);font-size:12px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.r .c{grid-column:2/4}
.r.chk .c{display:flex;align-items:center;gap:6px;color:#cfcfcf;font-size:12px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:#121212;border:1px solid #333;border-bottom-color:#3d3d3d}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:15px;margin-top:-6.5px;background:linear-gradient(#5e5e5e,#4a4a4a 48%,#444 52%,#383838);border:1px solid #2a2a2a;border-top-color:#727272}
input[type=range]::-moz-range-track{height:4px;background:#121212;border:1px solid #333}
input[type=range]::-moz-range-thumb{width:9px;height:15px;border-radius:0;background:#4a4a4a;border:1px solid #2a2a2a}
/* 프리셋 패널 */
#presetPane{display:none}#presetPane.show{display:block}
#plist .pi{padding:8px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #2e2e2e}
#plist .pi:hover{background:#303030}#plist .pi.cur{color:#fff;background:var(--blue);box-shadow:inset 2px 0 0 var(--edge)}
#plist .pi small{color:var(--sub)}#plist .pi.cur small{color:#cfd8e6}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:10px 0 18px}
.acts .full{grid-column:1/-1}
.erow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px}
/* 가운데: 경로 줄 · 작업대 · 사진 줄 */
#mid{display:grid;grid-template-rows:30px minmax(0,1fr) 96px;min-height:0}
#crumb{display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden}
#crumb b{color:var(--ink);font-weight:500}
#crumb .key{border:1px solid #6e5a1e;color:var(--key);padding:1px 8px;background:#2b2614}
#stage{position:relative;overflow:hidden;background:radial-gradient(var(--dot) 1px,transparent 1.2px) 0 0/14px 14px,var(--desk)}
#stage.drag{box-shadow:inset 0 0 0 3px var(--edge)}
#cv{position:absolute;inset:0;width:100%;height:100%}
#cv.paint{cursor:none}#cv.pan,#cv.pan.paint{cursor:grab}#cv.panning{cursor:grabbing!important}#zlab{min-width:58px}
#empty{position:absolute;inset:0;display:grid;place-items:center;color:#8a857e;font-size:15px;pointer-events:none}
#busy{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(38,38,38,.92);color:var(--ink);border:1px solid #555;padding:5px 12px;font-size:12px;display:none;z-index:3}
#hv{position:absolute;pointer-events:none;background:rgba(38,38,38,.92);border:1px solid #555;padding:2px 7px;font-size:11px;display:none;white-space:nowrap}
#strip{border-top:1px solid var(--line);display:flex;gap:10px;padding:8px 10px;overflow-x:auto;overflow-y:hidden;align-items:flex-start}
#list{display:flex;gap:10px}
.it{width:96px;flex:none;font-size:11px;color:var(--sub);text-align:center;cursor:pointer}
.it img{display:block;width:96px;height:60px;object-fit:cover;border:1px solid var(--line);background:#111;margin-bottom:3px}
.it.sel img{border:2px solid var(--edge)}.it.sel{color:#fff}
.it b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:inherit}
.it small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it small.err{color:#e5484d}
.addt{width:96px;height:60px;flex:none;border:1px dashed #555;display:grid;place-items:center;color:var(--sub);font-size:11px;cursor:pointer;background:none}

<script>
{
/* ================= DTME 버튼 (ui_style.py 와 같은 식) ================= */
const rgb = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const hex = a => '#' + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
const shade = (c, d) => hex(rgb(c).map(v => v + d));
const mix = (a, b, t) => hex(rgb(a).map((v, i) => v * (1 - t) + rgb(b)[i] * t));
const rgba = (c, al) => al >= 255 ? c : `rgba(${rgb(c).join(',')},${(al / 255).toFixed(3)})`;
function bevel(sel, bg, fg, o = {}) {
  const al = o.alpha || 255, lt = rgb(bg).reduce((a, b) => a + b) > 450 ? 10 : 22;
  const grad = (b, t, btm) => `linear-gradient(${rgba(shade(b, t), al)} 0%,${rgba(shade(b, Math.trunc(t / 3)), al)} 48%,${rgba(b, al)} 52%,${rgba(shade(b, btm), al)} 100%)`;
  const S = (p) => sel.split(',').map(s => s.trim() + p).join(',');
  const border = o.edge ? `border:1px solid ${o.edge};border-top-color:${shade(o.edge, 30)};`
    : `border:1px solid ${rgba(shade(bg, -28), al)};border-top-color:${rgba(shade(bg, lt + 14), al)};border-bottom-color:${rgba(shade(bg, -42), al)};`;
