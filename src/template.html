<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vector Man</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* DTME 스타일: 진회색 바탕 · 사각 입체 버튼(그림자 없음) · 켜짐 파랑 · 실행 빨강. 버튼 그라데이션은 아래 스크립트가 DTME ui_style.py 식으로 만듦 */
:root{--win:#232323;--base:#1a1a1a;--alt:#262626;--line:#3a3a3a;--ink:#e6e6e6;--sub:#8a8a8a;--dim:#6a6a6a;--blue:#2f4f78;--edge:#4a8fe0;--red:#c0392b}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--win);color:var(--ink);font:13px/1.4 "Pretendard Variable",Pretendard,"Malgun Gothic","맑은 고딕",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;user-select:none}
button{font:inherit;color:var(--ink);height:28px;padding:0 12px;cursor:pointer;border-radius:0}
button:focus-visible,select:focus-visible,input:focus-visible{outline:1px solid var(--edge);outline-offset:1px}
select,input[type=text]{font:inherit;color:var(--ink);background:var(--base);border:1px solid var(--line);height:26px;padding:0 6px;border-radius:0;width:100%}
input[type=color]{width:100%;height:26px;padding:1px;background:var(--base);border:1px solid var(--line);border-radius:0;cursor:pointer}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--blue);margin:0}
#top{height:40px;display:flex;align-items:center;gap:6px;padding:0 8px;border-bottom:1px solid #111}
#top .logo{font-weight:800;font-size:14px;letter-spacing:.2px;margin:0 10px 0 4px}
#top .sp{flex:1}
#mstat{color:var(--sub);font-size:12px;display:flex;align-items:center;gap:8px}
#mbar{width:110px;height:5px;background:var(--base);border:1px solid var(--line);display:none}
#mbar i{display:block;height:100%;width:0;background:var(--edge)}
main{flex:1;display:grid;grid-template-columns:230px minmax(0,1fr) 300px;min-height:0}
#left{background:var(--base);border-right:1px solid #111;display:flex;flex-direction:column;min-height:0}
#list{flex:1;overflow:auto}
.it{display:flex;gap:8px;align-items:center;padding:6px 8px;cursor:pointer;border-bottom:1px solid #202020}
.it:hover{background:#222}.it.sel{background:var(--blue);box-shadow:inset 0 0 0 1px var(--edge)}
.it img{width:38px;height:38px;object-fit:cover;flex:none;background:#2a2a2a}
.it b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it small{font-size:11px;color:var(--sub)}.it small.err{color:#e5484d}.it small.ok{color:#9a9a9a}
.it.sel small{color:#cfd8e6}
#stage{position:relative;overflow:hidden;background:#141414}
#stage.bg-check{background:repeating-conic-gradient(#2a2a2a 0 25%,#202020 0 50%) 0 0/20px 20px}
#stage.bg-white{background:#fff}#stage.bg-black{background:#000}#stage.bg-gray{background:#808080}
#cv{position:absolute;inset:0;width:100%;height:100%}
#empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-size:14px;pointer-events:none}
#stage.drag{box-shadow:inset 0 0 0 2px var(--edge)}
#busy{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(38,38,38,.92);border:1px solid #555;padding:5px 12px;font-size:12px;display:none}
#pts{position:absolute;left:10px;top:10px;background:rgba(38,38,38,.88);border:1px solid #444;padding:4px 10px;font-size:13px;font-weight:700;display:none;font-variant-numeric:tabular-nums}
#pts small{font-weight:400;color:var(--sub);margin-left:6px}
#tools{position:absolute;right:10px;top:10px;display:flex;gap:2px}
#tools button{height:24px;font-size:11px;padding:0 10px}
#hv{position:absolute;pointer-events:none;background:rgba(38,38,38,.92);border:1px solid #555;padding:2px 7px;font-size:11px;display:none;white-space:nowrap}
#cv.paint{cursor:none}
#views{position:absolute;left:10px;bottom:10px;display:flex;gap:2px}
#views button{height:24px;font-size:11px;padding:0 10px}
#views .vsep{width:10px}
#right{border-left:1px solid #111;display:flex;flex-direction:column;min-height:0}
#scroll{flex:1;overflow:auto;padding:8px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px;margin-bottom:6px;position:relative}
#presetBtn{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#plist{position:absolute;left:0;right:0;top:30px;z-index:5;background:var(--alt);border:1px solid #555;display:none;max-height:340px;overflow:auto}
#plist.open{display:block}
#plist .pi{padding:6px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
#plist .pi:hover{background:#333}#plist .pi.cur{color:#fff;background:var(--blue)}
#plist .pi small{color:var(--sub)}
#plist .pact{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:6px;border-top:1px solid #3a3a3a}
#plist .pact button{height:26px;font-size:12px}
.erow{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:6px;align-items:center;margin-bottom:8px}
.erow label,.r label{color:#cfcfcf;text-align:right;white-space:nowrap;font-size:12px}
.grp{margin-bottom:4px}
.grp>button{width:100%;text-align:left;padding:0 8px;height:26px;font-size:12px}
.grp .body{padding:8px 2px 6px}
.grp.closed .body{display:none}
.r{display:grid;grid-template-columns:72px minmax(0,1fr) 46px;gap:6px;align-items:center;min-height:26px;margin-bottom:3px}
.r .v{color:var(--sub);font-size:12px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.r .c{grid-column:2/4}
.r.chk .c{display:flex;align-items:center;gap:6px;color:#cfcfcf;font-size:12px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:#121212;border:1px solid #333;border-bottom-color:#3d3d3d}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:15px;margin-top:-6.5px;background:linear-gradient(#5e5e5e,#4a4a4a 48%,#444 52%,#383838);border:1px solid #2a2a2a;border-top-color:#727272}
input[type=range]::-moz-range-track{height:4px;background:#121212;border:1px solid #333}
input[type=range]::-moz-range-thumb{width:9px;height:15px;border-radius:0;background:#4a4a4a;border:1px solid #2a2a2a}
#bottom{border-top:1px solid #111;padding:8px;display:grid;gap:4px}
#stats{color:var(--sub);font-size:11px;min-height:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:4px}
#bottom .main{height:32px}
/* 팝업: DTME Popup — 진회색 · 테두리 #555 · 둥근 6 · 오른쪽 아래 [취소][확인] */
#pop{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.35);z-index:20}
#pop.open{display:grid}
#pop .box{background:#262626;border:1px solid #555;border-radius:6px;padding:20px 22px 16px;min-width:300px;max-width:90vw}
#pop .msg{margin-bottom:16px;white-space:pre-line}
#pop input{margin-bottom:14px;height:28px}
#pop .btns{display:flex;justify-content:flex-end;gap:8px}
#pop .btns button{min-width:72px;height:30px}
@media(max-width:900px){body{overflow:auto}main{grid-template-columns:1fr;grid-auto-rows:auto}#left{max-height:200px}#stage{height:60vh}}
</style>
<style id="bevel"></style>
</head>
<body>
<div id="top">
  <span class="logo">Vector Man</span>
  <button id="add" class="b" title="사진 추가 (끌어다 놓기 가능)">사진 추가</button>
  <button id="runAll" class="b red" disabled title="목록의 모든 사진을 처리">전체 처리</button>
  <button id="clear" class="b" disabled>목록 비우기</button>
  <span class="sp"></span>
  <div id="mstat"><span id="mtext">엔진 대기</span><div id="mbar"><i></i></div></div>
  <span style="color:var(--dim);font-size:11px;margin-left:8px">v__VER__</span>
</div>
<input id="fin" type="file" accept="image/*" multiple hidden>
<main>
  <aside id="left"><div id="list"></div></aside>
  <section id="stage" class="bg-check">
    <canvas id="cv"></canvas>
    <div id="empty">사진을 끌어다 놓기</div>
    <div id="busy"></div>
    <div id="pts"></div>
    <div id="hv"></div>
    <div id="tools">
      <button data-t="view" class="b ov on" title="보기 (V)">보기</button>
      <button data-t="1" class="b ov" title="브러시 (B) · 부분 브러시의 허용 오차·장력을 칠한 자리에 찍음">브러시</button>
      <button data-t="0" class="b ov" title="지우개 (E) · 칠한 값을 지워 전체 값으로">지우개</button>
      <button id="zclear" class="b ov" title="이 사진의 브러시 모두 지우기">비우기</button>
    </div>
    <div id="views">
      <button data-v="line" class="b ov on" title="벡터: 사진 위 벡터 선·점 (1)">벡터</button>
      <button data-v="vmask" class="b ov" title="벡터 마스크: SVG 패스를 흰색으로 채운 모양 (2)">마스크</button>
      <span class="vsep"></span>
      <button data-v="cut" class="b ov" title="비트맵: 배경을 지운 PNG (3)">비트맵</button>
      <button data-v="mask" class="b ov" title="비트맵 마스크: AI 마스크 PNG (4)">마스크</button>
    </div>
  </section>
  <aside id="right">
    <div id="scroll">
      <div class="prow">
        <button id="presetBtn" class="b" title="프리셋 고르기·관리">프리셋: 기본 ▾</button>
        <button id="presetSave" class="b" title="지금 설정을 프리셋으로 저장">저장…</button>
        <div id="plist"></div>
      </div>
      <div class="erow">
        <label>엔진</label>
        <select id="engine" title="계산 엔진"><option value="web">브라우저 · BiRefNet-lite</option><option value="pc" disabled>PC 엔진 · HR-matting (준비 중)</option></select>
        <button id="pickModel" class="b" title="모델 다운로드가 막힐 때: 받아 둔 모델 파일(.onnx)을 직접 선택" style="padding:0 8px">파일…</button>
      </div>
      <div id="groups"></div>
    </div>
    <div id="bottom">
      <div id="stats"></div>
      <button id="sSvg" class="b red main" disabled title="선택한 사진의 벡터 SVG 저장">SVG 저장</button>
      <div class="two"><button id="sPng" class="b" disabled title="배경을 지운 PNG">투명 PNG</button><button id="sMask" class="b" disabled title="흑백 마스크 PNG">마스크 PNG</button></div>
      <button id="sZip" class="b" disabled title="처리된 모든 사진의 SVG·PNG·마스크를 ZIP 하나로">전체 ZIP</button>
    </div>
  </aside>
</main>
<input id="fmodel" type="file" accept=".onnx" hidden>
<input id="fpreset" type="file" accept=".json,application/json" hidden>
<div id="pop"><div class="box"><div class="msg"></div><input type="text" hidden><div class="btns"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.1/dist/ort.webgpu.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/*CORE*/
</script>
<script>
{
/* ================= DTME 버튼 (ui_style.py 와 같은 식) ================= */
const rgb = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const hex = a => '#' + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
const shade = (c, d) => hex(rgb(c).map(v => v + d));
const mix = (a, b, t) => hex(rgb(a).map((v, i) => v * (1 - t) + rgb(b)[i] * t));
const rgba = (c, al) => al >= 255 ? c : `rgba(${rgb(c).join(',')},${(al / 255).toFixed(3)})`;
function bevel(sel, bg, fg, o = {}) {
  const al = o.alpha || 255, lt = rgb(bg).reduce((a, b) => a + b) > 450 ? 10 : 22;
  const grad = (b, t, btm) => `linear-gradient(${rgba(shade(b, t), al)} 0%,${rgba(shade(b, Math.trunc(t / 3)), al)} 48%,${rgba(b, al)} 52%,${rgba(shade(b, btm), al)} 100%)`;
  const S = (p) => sel.split(',').map(s => s.trim() + p).join(',');
  const border = o.edge ? `border:1px solid ${o.edge};border-top-color:${shade(o.edge, 30)};`
    : `border:1px solid ${rgba(shade(bg, -28), al)};border-top-color:${rgba(shade(bg, lt + 14), al)};border-bottom-color:${rgba(shade(bg, -42), al)};`;
  const dbg = mix(bg, '#3a3a3a', .55), dfg = mix(fg, '#8a8a8a', .6);
  let css = `${S('')}{color:${fg};${o.bold ? 'font-weight:700;' : ''}${border}background:${grad(bg, lt, -16)}}`;
  css += `${S(':hover:not(:disabled)')}{background:${grad(bg, lt + 10, -6)}}`;
  css += `${S(':active:not(:disabled)')}{background:${grad(bg, -18, Math.trunc(lt / 2))};${o.edge ? '' : `border-top-color:${rgba(shade(bg, -42), al)};border-bottom-color:${rgba(shade(bg, lt), al)};`}}`;
  css += `${S(':disabled')}{color:${dfg};cursor:default;background:${grad(dbg, 0, -24)};border-color:${shade(dbg, -28)}}`;
  return css;
}
document.getElementById('bevel').textContent =
  bevel('.b', '#383838', '#e6e6e6') + bevel('.b.red', '#c0392b', '#ffffff', { bold: 1 }) +
  bevel('.b.ov', '#262626', '#dddddd', { alpha: 225 }) + bevel('.b.head', '#2b2b2b', '#e0e0e0', { bold: 1 }) +
  bevel('.b.on,.b.ov.on', '#2f4f78', '#ffffff', { edge: '#4a8fe0' });

/* ================= 설정 정의 ================= */
// t: range | check | select | color | text. u = 단위. tip = 툴팁(화면 설명 문구 대신)
const GROUPS = [
  ['경계', [
    { k: 'thr', l: '경계 기준', t: 'range', min: .05, max: .95, s: .05, d: .5, f: 2, tip: '낮추면 잔머리·반투명 부분까지 포함, 높이면 안쪽을 땀' },
    { k: 'offset', l: '확장·축소', t: 'range', min: -10, max: 10, s: 1, d: 0, u: 'px', tip: '벡터를 바깥(+)·안쪽(−)으로 이동 (원본 픽셀)' },
    { k: 'feather', l: '페더', t: 'range', min: 0, max: 10, s: 1, d: 1, u: 'px', tip: 'PNG·마스크 경계를 흐리는 정도' },
  ]],
  ['곡선', [
    { k: 'smooth', l: '부드럽게', t: 'range', min: 0, max: 12, s: 1, d: 2, u: 'px', tip: '외곽의 잔물결 제거' },
    { k: 'simplify', l: '허용 오차', t: 'range', min: .3, max: 6, s: .1, d: 1, f: 1, u: 'px', tip: '곡선이 원래 윤곽에서 벗어나도 되는 최대 거리(작업 해상도 px). 클수록 점이 적고, 작을수록 정확' },
    { k: 'target', l: '목표 점 수', t: 'range', min: 0, max: 1000, s: 10, d: 0, z: '끔', tip: '점 수가 이 값 이하가 되도록 허용 오차를 자동으로 키움 (0 = 끔)' },
    { k: 'merge', l: '점 합치기', t: 'range', min: 0, max: 100, s: 1, d: 5, z: '끔', u: '%', tip: '이웃한 곡선 두 개를 하나로 합쳐도 허용 오차의 (100+이 값)% 안이면 합침. 1~5% = 정확도 거의 그대로 점만 감소' },
    { k: 'alloc', l: '곡률 배분', t: 'range', min: 0, max: 100, s: 5, d: 0, z: '끔', tip: '점 수는 그대로 두고, 많이 휘는 곳(머리카락·귀)에 점을 몰아주고 완만한 곳(팔·몸통)은 줄임' },
    { k: 'tension', l: '장력', t: 'range', min: -30, max: 30, s: 1, d: 0, u: '%', tip: '핸들 길이 조절. + = 둥글고 통통하게, − = 팽팽하고 각지게 (그만큼 원래 윤곽에서 벗어남)' },
    { k: 'corner', l: '모서리 보존', t: 'range', min: 0, max: 100, s: 5, d: 0, tip: '모자 챙·어깨 같은 꺾인 곳을 각지게 유지 (0 = 끔)' },
    { k: 'curve', l: '연결', t: 'select', d: 'bezier', o: [['bezier', '베지어 곡선'], ['line', '직선']] },
  ]],
  ['부분 브러시', [
    { k: 'btol', l: '허용 오차', t: 'range', min: .2, max: 6, s: .1, d: .5, f: 1, u: 'px', tip: '브러시로 칠할 때 찍히는 허용 오차. 칠한 뒤 바꿔도 이미 칠한 곳은 그대로 (다시 칠하면 덮어씀)' },
    { k: 'bten', l: '장력', t: 'range', min: -30, max: 30, s: 1, d: 0, u: '%', tip: '브러시로 칠할 때 찍히는 장력' },
    { k: 'bsize', l: '브러시 크기', t: 'range', min: 5, max: 300, s: 5, d: 60, u: 'px', tip: '화면 기준 지름. [ ] 키로 조절' },
  ]],
  ['정리', [
    { k: 'speck', l: '조각 제거', t: 'range', min: 0, max: 20, s: .5, d: 2, f: 1, u: '%', tip: '가장 큰 덩어리 대비 이 크기보다 작은 조각 제거' },
    { k: 'hole', l: '구멍 메우기', t: 'range', min: 0, max: 5, s: .1, d: .3, f: 1, u: '%', tip: '인물 면적 대비 이 크기보다 작은 구멍 메움' },
    { k: 'holeAll', l: '', t: 'check', d: false, c: '구멍 전부 메우기', tip: '팔과 몸 사이 같은 큰 구멍까지 모두 메움' },
    { k: 'people', l: '인물 수', t: 'select', d: '0', o: [['0', '전부'], ['1', '1명 (가장 큰 것)'], ['2', '2명'], ['3', '3명']] },
  ]],
  ['SVG 출력', [
    { k: 'svgMode', l: '모양', t: 'select', d: 'fill', o: [['fill', '채움'], ['stroke', '선'], ['both', '채움 + 선']] },
    { k: 'fillColor', l: '채움 색', t: 'color', d: '#000000' },
    { k: 'strokeColor', l: '선 색', t: 'color', d: '#000000' },
    { k: 'strokeW', l: '선 굵기', t: 'range', min: .5, max: 20, s: .5, d: 2, f: 1, u: 'pt' },
    { k: 'cut', l: '칼선 여백', t: 'range', min: 0, max: 100, s: 1, d: 0, u: 'px', tip: '벡터에서 이만큼 띄운 칼선 패스를 따로 추가 (0 = 없음, 원본 픽셀)' },
    { k: 'cutColor', l: '칼선 색', t: 'color', d: '#ff0000' },
  ]],
  ['PNG 출력', [
    { k: 'pngScale', l: '크기', t: 'select', d: '1', o: [['1', '원본 100%'], ['0.5', '50%'], ['0.25', '25%']] },
    { k: 'maskInv', l: '', t: 'check', d: false, c: '마스크 반전', tip: '인물 검정, 배경 흰색' },

function alphaCanvas(a, w, h, gray, inv) {

}
function buildSVG(r, W, H) {

  const st = m === 'fill' ? '' : ` stroke="${S.strokeColor}" stroke-width="${S.strokeW}" stroke-linejoin="round"`;
  let s = `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">\n`;
  s += `<path id="person" fill="${fill}" fill-rule="evenodd"${st} d="${r.d}"/>\n`;

const fname = (n, tail) => (S.prefix || '') + n.replace(/\.[^.]+$/, '') + (S.suffix || '') + tail;
async function renderFiles(it, bmp) {
  const W = bmp.width, H = bmp.height, [ww, wh] = workSize(W, H), sc = W / ww;
  const prob = probAt(it.mask, ww, wh), r = Core.vectorize(prob, ww, wh, opts(sc, it));
  const al = alphaOf(prob, r.bin, ww, wh, sc), k = +S.pngScale, PW = Math.max(1, Math.round(W * k)), PH = Math.max(1, Math.round(H * k));
  const cut = new OffscreenCanvas(PW, PH), g = cut.getContext('2d');
  g.imageSmoothingQuality = 'high'; g.drawImage(bmp, 0, 0, PW, PH); g.globalCompositeOperation = 'destination-in'; g.drawImage(alphaCanvas(al, ww, wh), 0, 0, PW, PH);
  const mk = new OffscreenCanvas(PW, PH), g2 = mk.getContext('2d');
  g2.imageSmoothingQuality = 'high'; g2.drawImage(alphaCanvas(al, ww, wh, true, S.maskInv), 0, 0, PW, PH);
  return { svg: new Blob([buildSVG(r, W, H)], { type: 'image/svg+xml' }),

}

/* ================= 목록 ================= */
const items = []; let sel = -1, view = 'line', cur = null, res = null;
function addFiles(fs) {
  for (const f of fs) if (f.type.startsWith('image/')) { const it = { file: f, name: f.name, url: '', mask: null, st: '대기', cls: '' }; items.push(it); thumb(it); }
  drawList(); if (sel < 0 && items.length) select(0);
  ensureModel().catch(() => {});
}
async function thumb(it) {
  try { const b = await createImageBitmap(it.file), s = 80 / Math.max(b.width, b.height), c = document.createElement('canvas');
    c.width = Math.round(b.width * s); c.height = Math.round(b.height * s); c.getContext('2d').drawImage(b, 0, 0, c.width, c.height); b.close();
    it.url = c.toDataURL('image/jpeg', 0.8); drawList(); } catch (e) {}
}
function drawList() {
  $('list').innerHTML = items.map((it, i) => `<div class="it${i === sel ? ' sel' : ''}" data-i="${i}"><img src="${it.url || 'data:,'}" alt=""><div><b></b><small class="${it.cls}"></small></div></div>`).join('');
  [...$('list').children].forEach((el, i) => { el.querySelector('b').textContent = items[i].name; el.querySelector('small').textContent = items[i].st; });
  const has = items.length > 0;
  $('runAll').disabled = !has; $('clear').disabled = !has; $('sZip').disabled = !items.some(i => i.mask);
  $('empty').style.display = has ? 'none' : 'grid';
}
function setSt(it, st, cls) { it.st = st; it.cls = cls || ''; drawList(); }
let queue = Promise.resolve();
function process(i) {
  const it = items[i]; if (it.mask) return Promise.resolve();
  if (!it.p) { it.p = queue.then(() => doProcess(it)); queue = it.p.catch(() => {}); it.p.catch(() => { it.p = null; }); }
  return it.p;
}
async function doProcess(it) {
  if (it.mask) return;
  setSt(it, '처리 중…');
  const t = performance.now();
  try { const bmp = await createImageBitmap(it.file); it.mask = await infer(bmp); bmp.close(); setSt(it, '완료 · ' + ((performance.now() - t) / 1000).toFixed(1) + '초', 'ok'); }
  catch (e) { console.error(e); setSt(it, '오류: ' + (e.message || e), 'err'); throw e; }
}
async function select(i) {
  sel = i; drawList();
  const it = items[i]; busy('불러오는 중…');
  if (cur && cur.bmp) cur.bmp.close();
  cur = { bmp: await createImageBitmap(it.file), it }; res = null;
  if (!it.mask) { draw(); busy('인물 영역 찾는 중…'); try { await process(i); } catch (e) { busy(''); draw(); return; } }
  if (sel !== i) return;
  busy(''); update();
}

/* ================= 미리보기 ================= */
function update() {
  if (!cur || !cur.it.mask) { draw(); return; }
  const W = cur.bmp.width, H = cur.bmp.height, [ww, wh] = workSize(W, H), key = ww + 'x' + wh;
  if (cur.key !== key) { cur.prob = probAt(cur.it.mask, ww, wh); cur.key = key; cur.ww = ww; cur.wh = wh; }
  const t = performance.now();
  res = Core.vectorize(cur.prob, ww, wh, opts(W / ww, cur.it));
  res.path = new Path2D(res.d); res.cutPath = res.cut ? new Path2D(res.cut) : null; cur.alpha = null;
  $('stats').textContent = `${W}×${H} · 작업 ${ww}×${wh} · ${(performance.now() - t).toFixed(0)}ms`;
  $('pts').innerHTML = `점 ${res.nodes.toLocaleString()}개<small>패스 ${res.paths} · 오차 ${res.tol.toFixed(1)}px${S.target && res.tol > S.simplify ? ' (자동)' : ''}</small>`;
  $('pts').style.display = 'block';
  ['sSvg', 'sPng', 'sMask'].forEach(b => $(b).disabled = false);
  draw();
}
function draw() {
  const cv = $('cv'), dpr = devicePixelRatio || 1, Wc = cv.clientWidth, Hc = cv.clientHeight;
  cv.width = Wc * dpr; cv.height = Hc * dpr;
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, Wc, Hc);
  if (!cur) return;
  const W = cur.bmp.width, H = cur.bmp.height, s = Math.min((Wc - 24) / W, (Hc - 60) / H), ox = (Wc - W * s) / 2, oy = (Hc - 36 - H * s) / 2;
  cur.vw = { ox, oy, s };
  const ready = cur.it.mask && res;
  if (!ready || view === 'line') {
    g.drawImage(cur.bmp, ox, oy, W * s, H * s);
    if (!ready) return;
    g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(ox, oy, W * s, H * s);
    g.save(); g.beginPath(); g.rect(ox, oy, W * s, H * s); g.clip(); g.translate(ox, oy); g.scale(s, s);
    g.save(); g.clip(res.path, 'evenodd'); g.drawImage(cur.bmp, 0, 0); g.restore();
    g.lineWidth = S.lineW / s; g.strokeStyle = S.lineColor; g.lineJoin = 'round'; g.stroke(res.path);
    if (res.cutPath) { g.setLineDash([6 / s, 4 / s]); g.strokeStyle = S.cutColor; g.stroke(res.cutPath); g.setLineDash([]); }
    if (cur.it.zgN || tool !== 'view') drawZones(g);
    if (S.showPts) {   // 고정점: 흰 사각 + 선 색 테두리
      const a = res.anchors, q = 3.5 / s; g.fillStyle = '#fff'; g.strokeStyle = S.lineColor; g.lineWidth = 1 / s;
      for (let i = 0; i < a.length; i += 2) { g.fillRect(a[i] - q, a[i + 1] - q, 2 * q, 2 * q); g.strokeRect(a[i] - q, a[i + 1] - q, 2 * q, 2 * q); }
    }
    g.restore();
    if (tool !== 'view' && mouse) { g.beginPath(); g.arc(mouse[0], mouse[1], S.bsize / 2, 0, 7); g.strokeStyle = '#fff'; g.lineWidth = 1.5; g.stroke(); g.strokeStyle = '#000'; g.lineWidth = .5; g.stroke(); }
    return;
  }
  if (view === 'vmask') {   // SVG 패스를 그대로 채워서 (저장 없이 SVG 모양 확인)
    const inv = S.maskInv;
    g.fillStyle = inv ? '#fff' : '#000'; g.fillRect(ox, oy, W * s, H * s);
    g.save(); g.translate(ox, oy); g.scale(s, s); g.fillStyle = inv ? '#000' : '#fff'; g.fill(res.path, 'evenodd');
    if (res.cutPath) { g.setLineDash([6 / s, 4 / s]); g.strokeStyle = S.cutColor; g.lineWidth = 1.5 / s; g.stroke(res.cutPath); }
    g.restore(); return;

  if (view === 'cut') {
    const c = new OffscreenCanvas(cur.ww, cur.wh), cg = c.getContext('2d');
    cg.drawImage(cur.bmp, 0, 0, cur.ww, cur.wh); cg.globalCompositeOperation = 'destination-in'; cg.drawImage(alphaCanvas(cur.alpha, cur.ww, cur.wh), 0, 0);

/* ================= 부분 브러시 ================= */
let tool = 'view', mouse = null, painting = null;
function ensureZg(it, W, H) {   // 긴 변 512 격자: tol(0 = 칠 안 함) · ten
  if (!it.zg) { const k = 512 / Math.max(W, H), gw = Math.max(1, Math.round(W * k)), gh = Math.max(1, Math.round(H * k)); it.zg = { gw, gh, tol: new Float32Array(gw * gh), ten: new Float32Array(gw * gh) }; it.zgN = 0; }
  return it.zg;
}
const brushSnap = it => ({ k: 'b', it, tol: it.zg.tol.slice(), ten: it.zg.ten.slice() });
function zgCount(it) { let n = 0; for (const v of it.zg.tol) if (v > 0) n++; it.zgN = n; }
function zcol(v) {   // 세밀(0.2px) = 진한 파랑 → 단순(6px) = 연한 노랑
  const k = Math.min(1, Math.max(0, Math.log(v / .2) / Math.log(30)));
  return [74 + (242 - 74) * k, 143 + (201 - 143) * k, 224 + (76 - 224) * k, 150 - 80 * k];
}
function drawZones(g) {   // 이미지 좌표계(translate·scale 된 상태)에서 호출
  const it = cur.it, zg = ensureZg(it, cur.bmp.width, cur.bmp.height);
  if (!it.zc || it.zcDirty) {
    const c = it.zc || new OffscreenCanvas(zg.gw, zg.gh), cg = c.getContext('2d'), id = cg.createImageData(zg.gw, zg.gh);
    for (let i = 0; i < zg.tol.length; i++) { const v = zg.tol[i]; if (v > 0) id.data.set(zcol(v), i * 4); }
    cg.putImageData(id, 0, 0); it.zc = c; it.zcDirty = false;
  }
  g.save(); g.imageSmoothingEnabled = true; g.drawImage(it.zc, 0, 0, cur.bmp.width, cur.bmp.height); g.restore();
}
function gridAt(x, y) {
  const W = cur.bmp.width, zg = ensureZg(cur.it, W, cur.bmp.height), v = cur.vw, k = zg.gw / W;
  return { zg, gx: (x - v.ox) / v.s * k, gy: (y - v.oy) / v.s * k, r: S.bsize / 2 / v.s * k };
}
function paintAt(x, y) {
  const { zg, gx, gy, r } = gridAt(x, y), tv = tool === '1' ? S.btol : 0, nv = tool === '1' ? S.bten / 100 : 0;
  for (let yy = Math.max(0, Math.floor(gy - r)); yy <= Math.min(zg.gh - 1, Math.ceil(gy + r)); yy++)
    for (let xx = Math.max(0, Math.floor(gx - r)); xx <= Math.min(zg.gw - 1, Math.ceil(gx + r)); xx++)
      if ((xx + .5 - gx) ** 2 + (yy + .5 - gy) ** 2 <= r * r) { zg.tol[yy * zg.gw + xx] = tv; zg.ten[yy * zg.gw + xx] = nv; }
  cur.it.zcDirty = true;
}
function hover(x, y) {   // 칠한 자리 값 표시
  const h = $('hv');
  if (!cur || !cur.vw || !cur.it.zgN || view !== 'line') { h.style.display = 'none'; return; }
  const { zg, gx, gy } = gridAt(x, y), ix = Math.floor(gx), iy = Math.floor(gy);
  const k = ix >= 0 && iy >= 0 && ix < zg.gw && iy < zg.gh ? iy * zg.gw + ix : -1;
  if (k < 0 || !(zg.tol[k] > 0)) { h.style.display = 'none'; return; }
  const tn = Math.round(zg.ten[k] * 100);
  h.textContent = `${zg.tol[k].toFixed(1)}px · ${tn > 0 ? '+' : ''}${tn}%`; h.style.left = (x + 14) + 'px'; h.style.top = (y + 14) + 'px'; h.style.display = 'block';
}
function setTool(t) {
  tool = t; [...$('tools').querySelectorAll('[data-t]')].forEach(b => b.classList.toggle('on', b.dataset.t === t));
  $('cv').classList.toggle('paint', t !== 'view'); if (t !== 'view' && view !== 'line') setView('line'); else draw();   // 칠하기는 벡터 보기에서
}
$('tools').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'zclear') {
    if (!cur || !cur.it.zgN) return;
    if (await popup('이 사진의 브러시를 모두 지울까요?', [['cancel', '취소'], ['ok', '지우기', 'red']]) !== 'ok') return;
    pushHist(brushSnap(cur.it)); cur.it.zg.tol.fill(0); cur.it.zg.ten.fill(0); cur.it.zgN = 0; cur.it.zcDirty = true; update(); return;
  }
  setTool(b.dataset.t);
};
const cvPos = e => { const r = $('cv').getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
$('cv').addEventListener('pointerdown', e => {
  if (tool === 'view' || !cur || !cur.it.mask || !cur.vw) return;
  $('cv').setPointerCapture(e.pointerId); commitHist();
  ensureZg(cur.it, cur.bmp.width, cur.bmp.height); painting = brushSnap(cur.it);
  mouse = cvPos(e); paintAt(...mouse); draw();
});
$('cv').addEventListener('pointermove', e => {
  mouse = cvPos(e);
  if (painting) paintAt(...mouse);
  if (tool !== 'view') draw();
  hover(...mouse);
});
$('cv').addEventListener('pointerleave', () => { mouse = null; $('hv').style.display = 'none'; if (tool !== 'view') draw(); });
const endPaint = () => {
  if (!painting) return;
  const it = cur.it; pushHist(painting); painting = null; zgCount(it); update();
};
$('cv').addEventListener('pointerup', endPaint); $('cv').addEventListener('pointercancel', endPaint);

function busy(t) { $('busy').textContent = t; $('busy').style.display = t ? 'block' : 'none'; }

/* ================= 저장 ================= */
function save(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function saveOne(kind) {
  if (!cur || !cur.it.mask) return;
  busy('저장 파일 만드는 중…');
  try { const f = await renderFiles(cur.it, cur.bmp); save(f[kind], fname(cur.it.name, { svg: '_vector.svg', png: '_cutout.png', mask: '_mask.png' }[kind])); }
  catch (e) { popup('저장하지 못했습니다.\n' + (e.message || e), [['ok', '확인']]); }
  finally { busy(''); }
}
async function runAll() {
  $('runAll').disabled = true;
  try { await ensureModel(); } catch (e) { $('runAll').disabled = false; popup(e.message, [['ok', '확인']]); return; }
  for (let i = 0; i < items.length; i++) { if (!items[i].mask) { busy(`처리 중 ${i + 1} / ${items.length}`); try { await process(i); } catch (e) {} } }
  busy(''); drawList(); if (sel >= 0) update();
}
async function saveZip() {
  const zip = new JSZip(), done = items.filter(i => i.mask);
  try {
    for (let k = 0; k < done.length; k++) {
      busy(`ZIP 만드는 중 ${k + 1} / ${done.length}`);
      const it = done[k], bmp = await createImageBitmap(it.file), f = await renderFiles(it, bmp);
      bmp.close();
      zip.file(fname(it.name, '_vector.svg'), f.svg); zip.file(fname(it.name, '_cutout.png'), f.png); zip.file(fname(it.name, '_mask.png'), f.mask);
    }
    save(await zip.generateAsync({ type: 'blob' }), 'vectorman.zip');
  } catch (e) { popup('ZIP을 만들지 못했습니다.\n' + (e.message || e), [['ok', '확인']]); }
  busy('');
}

/* ================= 이벤트 ================= */
$('add').onclick = () => $('fin').click();
$('fin').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
['dragover', 'dragenter'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); $('stage').classList.add('drag'); }));
['dragleave', 'drop'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); $('stage').classList.remove('drag'); }));
document.addEventListener('drop', e => addFiles(e.dataTransfer.files));
$('list').onclick = e => { const el = e.target.closest('.it'); if (el) select(+el.dataset.i); };
$('runAll').onclick = runAll;
$('clear').onclick = async () => {
  if (await popup('목록을 비울까요?', [['cancel', '취소'], ['ok', '비우기', 'red']]) !== 'ok') return;
  items.length = 0; sel = -1; if (cur) cur.bmp.close(); cur = null; res = null; $('stats').textContent = ''; $('pts').style.display = 'none';
  ['sSvg', 'sPng', 'sMask'].forEach(b => $(b).disabled = true); drawList(); draw();
};
$('sSvg').onclick = () => saveOne('svg'); $('sPng').onclick = () => saveOne('png'); $('sMask').onclick = () => saveOne('mask');
$('sZip').onclick = saveZip;
function setView(v) { view = v; [...$('views').querySelectorAll('button')].forEach(x => x.classList.toggle('on', x.dataset.v === v)); draw(); }
$('views').onclick = e => { const b = e.target.closest('button'); if (b) setView(b.dataset.v); };
document.addEventListener('keydown', e => {
  if ($('pop').classList.contains('open')) return;
  if ((e.ctrlKey || e.metaKey) && !e.target.matches('input[type=text]')) {
    const k = e.key.toLowerCase();
    if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
    if ((k === 'z' && e.shiftKey) || k === 'y') { e.preventDefault(); redo(); return; }
  }
  if (e.target.matches('input[type=text]')) return;
  const v = { 1: 'line', 2: 'vmask', 3: 'cut', 4: 'mask' }[e.key]; if (v) setView(v);
  if (!e.ctrlKey && !e.metaKey && !e.altKey) {
    const tk = { v: 'view', b: '1', e: '0' }[e.key.toLowerCase()]; if (tk) setTool(tk);
    if (e.key === '[' || e.key === ']') { snap(); S.bsize = Math.max(5, Math.min(300, S.bsize + (e.key === ']' ? 10 : -10))); syncUI(); changed('bsize'); }
  }
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && items.length && !e.target.matches('select,input')) { e.preventDefault(); select(Math.max(0, Math.min(items.length - 1, sel + (e.key === 'ArrowDown' ? 1 : -1)))); }
});
$('pickModel').onclick = () => $('fmodel').click();
$('fmodel').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (!f || session) return; sessionP = null; try { await ensureModel(await f.arrayBuffer()); } catch (er) {} };
const ro = new ResizeObserver(() => draw()); ro.observe($('stage'));
buildGroups(); syncUI();
}
